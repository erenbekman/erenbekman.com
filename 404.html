<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found · Eren Bekman</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
<script>try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&display=swap" rel="stylesheet">
<style>
html{color-scheme:light}
:root{--bg:#fcfcfb;--fg:#111;--muted:#6b6b6b;--hover:#9a9a9a;--underline:#ccc;--underline-hover:#ddd}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#111110;--fg:#ededec;--muted:#9b9b99;--hover:#6f6f6d;--underline:#4a4a48;--underline-hover:#353534}}
:root[data-theme=dark]{color-scheme:dark;--bg:#111110;--fg:#ededec;--muted:#9b9b99;--hover:#6f6f6d;--underline:#4a4a48;--underline-hover:#353534}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Geist',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:600px;margin:0 auto;padding:112px 24px 72px;box-sizing:border-box;font-size:15px;line-height:1.7}
h1{margin:0;font-size:15px;font-weight:500;line-height:1.4}
p{margin:0;color:var(--muted)}
a{color:var(--fg);text-decoration:underline;text-decoration-color:var(--underline);text-underline-offset:3px}
a:hover{color:var(--hover);text-decoration-color:var(--underline-hover)}
</style>
</head>
<body>
<main>
  <h1>Page not found</h1>
  <p>This page doesn’t exist. <a href="/">Back to home</a></p>
</main>
</body>
</html>
